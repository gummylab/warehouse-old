# NOTE: CodeQL and dependency-review on PRIVATE repos require GitHub Advanced
# Security (paid). On the free plan these jobs are skipped (neutral) unless
# you set the repo variable ENABLE_SECURITY_SCAN=true after enabling GHAS.
# See: https://docs.github.com/en/get-started/learning-about-github/about-github-advanced-security
#
# Secret scanning + push protection likewise require GHAS on private repos
# (could not be enabled via API on the free plan).

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    # CodeQL requires GHAS on private repos; skipped (neutral) when disabled.
    name: CodeQL
    if: ${{ vars.ENABLE_SECURITY_SCAN == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3

  dependency-review:
    # Dependency review requires GHAS on private repos; skipped when disabled.
    name: Dependency Review
    if: ${{ vars.ENABLE_SECURITY_SCAN == 'true' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@cc4f6536e38d1126c5e3b0683d469a14f23bfea4 # v3
