name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # The whole check is `bun run verify` (lint + typecheck + unit tests +
    # production build), because cacheComponents only surfaces its
    # validation errors during the build, not in dev.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

  e2e:
    # The e2e suite needs a browser, so it is a job of its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: E2E tests
        run: bun run test:e2e
